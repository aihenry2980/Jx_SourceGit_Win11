name: Build
on:
  workflow_call:
jobs:
  build:
    strategy:
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            runtime: win-x64
          - name: Linux x64
            os: ubuntu-latest
            runtime: linux-x64
            container: ubuntu:20.04
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    steps:
      - name: Install common CLI tools
        if: startsWith(matrix.runtime, 'linux-')
        run: |
          export DEBIAN_FRONTEND=noninteractive
          ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
          apt-get update
          apt-get install -y sudo
          sudo apt-get install -y curl wget git unzip zip libicu66 tzdata clang
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Publish
        run: dotnet publish src/SourceGit.csproj -c Release -o publish -r ${{ matrix.runtime }}
      - name: Rename executable file
        if: startsWith(matrix.runtime, 'linux-')
        run: mv publish/SourceGit publish/sourcegit
      - name: Tar artifact
        if: startsWith(matrix.runtime, 'linux-')
        run: |
          tar -cvf "sourcegit.${{ matrix.runtime }}.tar" -C publish .
          rm -r publish/*
          mv "sourcegit.${{ matrix.runtime }}.tar" publish
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sourcegit.${{ matrix.runtime }}
          path: publish/*
